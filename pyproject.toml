[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "showcase-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "pymysql[rsa]>=1.1,<2",
  "uvicorn>=0.30,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
