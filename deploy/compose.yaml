services:
  api:
    image: ${SHOWCASE_API_IMAGE:-showcase-api:local}
    build:
      context: ../backend
    environment:
      ASSET_ROOT: /var/lib/showcase/assets
      FORWARDED_ALLOW_IPS: ${SHOWCASE_TRUSTED_PROXY_IPS:?Set the private proxy address}
    secrets:
      - database_url
    volumes:
      - ${SHOWCASE_ASSET_DIR:?Set a dedicated persistent path}:/var/lib/showcase/assets
    networks: [application, data]
    depends_on: [db]
    stop_grace_period: 60s
    restart: unless-stopped
  db:
    # This template does not pull a database image. Use an existing approved MySQL 8.0+ image.
    image: ${MYSQL_IMAGE:?Set the approved existing MySQL image}
    pull_policy: never
    environment:
      MYSQL_DATABASE: showcase
      MYSQL_USER: showcase
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    command: ["--default-time-zone=+00:00"]
    secrets: [mysql_password, mysql_root_password]
    volumes:
      - ${SHOWCASE_DB_DIR:?Set an isolated persistent MySQL path}:/var/lib/mysql
    networks: [data]
    restart: unless-stopped
  proxy:
    image: ${SHOWCASE_PROXY_IMAGE:-caddy:2-alpine}
    pull_policy: never
    depends_on: [api]
    environment:
      SHOWCASE_HOST: ${SHOWCASE_HOST:?Set the approved TLS host}
    secrets: [tls_cert, tls_key]
    ports:
      - "${SHOWCASE_HTTPS_PORT:-5000}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SHOWCASE_H5_DIST:?Set the H5 dist directory}:/srv/h5:ro
      - ${SHOWCASE_ADMIN_DIST:?Set the admin dist directory}:/srv/admin:ro
    networks: [application]
    restart: unless-stopped
networks:
  application:
  data:
    internal: true
secrets:
  database_url:
    file: ${SHOWCASE_DATABASE_URL_FILE:?Set the secret file path}
  mysql_password:
    file: ${SHOWCASE_MYSQL_PASSWORD_FILE:?Set the secret file path}
  mysql_root_password:
    file: ${SHOWCASE_MYSQL_ROOT_PASSWORD_FILE:?Set the secret file path}
  tls_cert:
    file: ${SHOWCASE_TLS_CERT_FILE:?Set the approved certificate file}
  tls_key:
    file: ${SHOWCASE_TLS_KEY_FILE:?Set the approved private key file}
