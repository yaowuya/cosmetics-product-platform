name: cosmetics-product-platform
services:
  api:
    container_name: cosmetics-product-platform
    image: ${SHOWCASE_API_IMAGE:?set SHOWCASE_API_IMAGE in .env}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASSET_ROOT: /var/lib/showcase/assets
      PYTHONPATH: /srv/showcase
      FORWARDED_ALLOW_IPS: ${SHOWCASE_FORWARDED_ALLOW_IPS:?set SHOWCASE_FORWARDED_ALLOW_IPS in .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?set ADMIN_LOGIN in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    secrets:
      - database_url
    volumes:
      - ${SHOWCASE_ASSET_DIR:?set SHOWCASE_ASSET_DIR in .env}:/var/lib/showcase/assets
      - .:/srv/showcase:ro
    networks: [application]
    stop_grace_period: 60s
    restart: unless-stopped
  proxy:
    image: ${SHOWCASE_PROXY_IMAGE:?set SHOWCASE_PROXY_IMAGE in .env}
    pull_policy: never
    depends_on: [api]
    ports:
      - "${SHOWCASE_HTTPS_PORT:?set SHOWCASE_HTTPS_PORT in .env}:443"
      - "${SHOWCASE_ADMIN_HTTPS_PORT:?set SHOWCASE_ADMIN_HTTPS_PORT in .env}:444"
    secrets: [tls_cert, tls_key]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SHOWCASE_H5_DIST:?set SHOWCASE_H5_DIST in .env}:/srv/h5:ro
      - ${SHOWCASE_ADMIN_DIST:?set SHOWCASE_ADMIN_DIST in .env}:/srv/admin:ro
    networks:
      application:
        ipv4_address: ${SHOWCASE_PROXY_IP:?set SHOWCASE_PROXY_IP in .env}
    restart: unless-stopped
networks:
  application:
    ipam:
      config:
        - subnet: ${SHOWCASE_SUBNET:?set SHOWCASE_SUBNET in .env}
secrets:
  database_url:
    file: ${SHOWCASE_DATABASE_URL_FILE:?set SHOWCASE_DATABASE_URL_FILE in .env}
  tls_cert:
    file: ${SHOWCASE_TLS_CERT_FILE:?set SHOWCASE_TLS_CERT_FILE in .env}
  tls_key:
    file: ${SHOWCASE_TLS_KEY_FILE:?set SHOWCASE_TLS_KEY_FILE in .env}
