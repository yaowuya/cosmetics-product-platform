name: cosmetics-product-platform
services:
  api:
    container_name: cosmetics-product-platform
    image: ${SHOWCASE_API_IMAGE:-showcase-api:local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASSET_ROOT: /var/lib/showcase/assets
      # Gateway and proxy addresses of the application network below. Never use *.
      FORWARDED_ALLOW_IPS: 172.28.50.1,172.28.50.10
    secrets:
      - database_url
    volumes:
      - ${SHOWCASE_ASSET_DIR:-/data/showcase/assets}:/var/lib/showcase/assets
      - .:/srv/showcase:ro
    networks: [application]
    stop_grace_period: 60s
    restart: unless-stopped
  proxy:
    image: ${SHOWCASE_PROXY_IMAGE:-caddy:2-alpine}
    pull_policy: never
    depends_on: [api]
    ports:
      - "${SHOWCASE_HTTPS_PORT:-5000}:443"
      - "${SHOWCASE_ADMIN_HTTPS_PORT:-5001}:444"
    secrets: [tls_cert, tls_key]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SHOWCASE_H5_DIST:-./frontend/h5/dist/build/h5}:/srv/h5:ro
      - ${SHOWCASE_ADMIN_DIST:-./frontend/admin/dist}:/srv/admin:ro
    networks:
      application:
        ipv4_address: 172.28.50.10
    restart: unless-stopped
networks:
  application:
    ipam:
      config:
        - subnet: 172.28.50.0/24
secrets:
  database_url:
    file: ${SHOWCASE_DATABASE_URL_FILE:-/data/showcase/secrets/database_url}
  tls_cert:
    file: ${SHOWCASE_TLS_CERT_FILE:-/data/showcase/secrets/tls.crt}
  tls_key:
    file: ${SHOWCASE_TLS_KEY_FILE:-/data/showcase/secrets/tls.key}
